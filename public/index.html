<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AgenciaIa Estúdio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f4fd8'/%3E%3Cpath d='M9 22l7-13 7 13' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="logo" aria-hidden="true">A</span>
      <div>
        <p class="marca-nome">AgenciaIa</p>
        <p class="marca-sub">Estúdio de agentes</p>
      </div>
    </div>
    <div class="motor" id="motor" data-estado="carregando" role="status" aria-live="polite">
      <span class="ponto" aria-hidden="true"></span>
      <span id="motor-texto">Verificando o motor de IA…</span>
    </div>
  </header>

  <main class="estudio">
    <nav class="equipe" aria-labelledby="equipe-titulo">
      <h2 id="equipe-titulo" class="rotulo">Equipe</h2>
      <ul id="lista-agentes" class="lista-agentes"></ul>
    </nav>

    <section class="mesa" aria-labelledby="agente-nome">
      <details class="perfil" id="perfil-bloco">
        <summary>
          <span class="rotulo">Cliente</span>
          <span id="perfil-resumo" class="perfil-resumo">Preencha o perfil do cliente</span>
        </summary>
        <div class="perfil-campos">
          <label>Marca ou cliente<input id="perfil-nome" type="text" autocomplete="off" placeholder="Clínica Sorriso Vivo"></label>
          <label>Nicho<input id="perfil-nicho" type="text" autocomplete="off" placeholder="Odontologia estética"></label>
          <label>Público<input id="perfil-publico" type="text" autocomplete="off" placeholder="Adultos de 25 a 50 anos, classe B"></label>
          <label>Tom de voz<input id="perfil-tom" type="text" autocomplete="off" placeholder="Acolhedor, confiante, sem jargão"></label>
        </div>
      </details>

      <form id="pedido" class="pedido" novalidate>
        <div class="pedido-cabeca">
          <p class="rotulo" id="agente-funcao"></p>
          <h1 id="agente-nome">Escolha um agente</h1>
          <p id="agente-descricao" class="descricao"></p>
        </div>
        <div id="campos" class="campos"></div>
        <label class="briefing">Observações extras (opcional)
          <textarea id="briefing" rows="2" placeholder="Algo que o agente precisa saber: datas, restrições, exemplos de que você gosta…"></textarea>
        </label>
        <div class="acoes">
          <button type="submit" id="gerar" class="botao-principal">Gerar</button>
          <span id="aviso" class="aviso" role="alert"></span>
        </div>
      </form>

      <article class="resultado" id="resultado" hidden aria-live="polite">
        <header class="resultado-topo">
          <p class="rotulo" id="resultado-meta"></p>
          <button type="button" id="copiar" class="botao-leve">Copiar texto</button>
        </header>
        <div id="resultado-texto" class="texto"></div>
      </article>

      <section class="historico" aria-labelledby="hist-titulo">
        <h2 id="hist-titulo" class="rotulo">Entregas recentes neste navegador</h2>
        <p id="hist-vazio" class="hist-vazio">Nada gerado ainda. O que você gerar aparece aqui para reabrir depois.</p>
        <ol id="hist-lista" class="hist-lista"></ol>
      </section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
